<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zap. — Pipeline Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='90' fill='%23E8571A'>⚡</text></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F7F5F2;color:#1C1917;-webkit-font-smoothing:antialiased}
.top{background:#1C1917;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:17px;font-weight:800;letter-spacing:-0.3px}
.top h1 span{color:#E8571A}
.dot{width:8px;height:8px;border-radius:50%;background:#2ECC71;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:16px 20px}
.stat{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-val{font-size:28px;font-weight:800;color:#1C1917}
.stat-val.green{color:#16A34A}.stat-val.amber{color:#D97706}.stat-val.red{color:#DC2626}
.stat-label{font-size:11px;color:#A8A29E;margin-top:3px;font-weight:500}
.tabs{display:flex;gap:8px;padding:0 20px 12px;border-bottom:1px solid #EEE;background:#fff}
.tab{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.tab.active-all{background:#1C1917;color:#fff}
.tab.active-posted{background:#16A34A;color:#fff}
.tab.active-filtered{background:#DC2626;color:#fff}
.tab.active-linkops{background:#0369A1;color:#fff}
.tab.active-domains{background:#7C3AED;color:#fff}
.dom-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.dom-badge.approved{background:#DCFCE7;color:#15803D}
.dom-badge.pending{background:#FEF3C7;color:#B45309}
.dom-badge.blocked{background:#FEE2E2;color:#B91C1C}
.dom-btn{padding:4px 10px;border-radius:4px;border:none;font-size:11px;font-weight:700;cursor:pointer;margin-right:4px}
.dom-btn.approve{background:#DCFCE7;color:#15803D}
.dom-btn.approve:hover{background:#BBF7D0}
.dom-btn.block{background:#FEE2E2;color:#B91C1C}
.dom-btn.block:hover{background:#FECACA}
.tab:not(.active-all):not(.active-posted):not(.active-filtered):not(.active-linkops):not(.active-domains):not(.active-apptabs):not(.active-hot){background:#F0EDE8;color:#78716C}
.tab.active-hot{background:#D97706;color:#fff}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 20px;background:#fff}
.toolbar input{flex:1;padding:7px 12px;border:1px solid #DDD;border-radius:6px;font-size:13px;font-family:inherit}
.btn-refresh{padding:7px 14px;border-radius:6px;background:#F0EDE8;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-refresh:hover{background:#E5E2DC}
.table-wrap{overflow-x:auto;padding:0 20px 24px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-top:12px}
th{background:#F5F3EF;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#78716C;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #EEE;white-space:nowrap}
td{padding:6px 10px;font-size:12px;border-bottom:1px solid #F5F3EF;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF8;transition:background 0.15s ease}
.badge{display:inline-block;padding:3px 6px;border-radius:6px;font-size:10px;font-weight:700;text-align:center;line-height:1.1;white-space:normal}
.badge.auto-posted{background:#DCFCE7;color:#15803D}
.badge.filtered{background:#FEE2E2;color:#B91C1C}
.badge.admin-approved{background:#E0F2FE;color:#0369A1}
.channel{font-size:11px;background:#F0EDE8;padding:3px 8px;border-radius:4px;color:#78716C;font-weight:500;white-space:nowrap;display:inline-block}
.raw-text{min-width:200px;max-width:400px;max-height:40px;overflow:hidden;color:#78716C;font-size:11px;cursor:pointer;line-height:1.3;word-break:break-word;text-align:left}
.raw-text:hover{color:#1C1917}
.raw-text.empty{cursor:default;color:#C9B8B3}
.copy-text{min-width:180px;max-width:280px;font-size:12px;color:#1C1917;font-weight:500;line-height:1.3;text-align:left;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.reason{min-width:140px;max-width:200px;font-size:12px;color:#B91C1C;line-height:1.3;text-align:left;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.img-thumb{width:40px;height:40px;object-fit:cover;border-radius:4px;background:#F0EDE8}
.img-placeholder{width:40px;height:40px;border-radius:4px;background:#F0EDE8;display:flex;align-items:center;justify-content:center;font-size:16px}
.img-cell{text-align:center}
.img-source{font-size:9px;color:#A8A29E;margin-top:2px;text-align:center;font-weight:500}
.time-cell{font-size:11px;color:#A8A29E;white-space:nowrap}
.cta-link{font-size:12px;font-weight:600;color:#fff;text-decoration:none;padding:4px 8px;border-radius:4px;background:#0369A1;display:inline-block;white-space:nowrap}
.cta-link:hover{background:#0284C7}
.cta-empty{font-size:11px;color:#C9B8B3}
.actions{display:flex;gap:4px;white-space:nowrap}
.btn-approve{padding:4px 10px;border-radius:4px;background:#DCFCE7;color:#15803D;border:none;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.15s ease}
.btn-approve:hover{background:#BBF7D0}
.btn-edit{padding:4px 10px;border-radius:4px;background:#E0F2FE;color:#0369A1;border:none;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.15s ease}
.btn-edit:hover{background:#BAE6FD}
.btn-remove{padding:4px 10px;border-radius:4px;background:#FEE2E2;color:#B91C1C;border:none;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.15s ease}
.btn-remove:hover{background:#FECACA}
.empty{text-align:center;padding:40px;color:#A8A29E}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.modal label{font-size:12px;font-weight:600;color:#78716C;display:block;margin-bottom:4px}
.modal textarea,.modal input[type=text]{width:100%;padding:8px 10px;border:1px solid #DDD;border-radius:6px;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:12px}
.modal textarea{min-height:80px}
.modal-img-preview{width:80px;height:80px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:none}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn-save{padding:8px 18px;border-radius:6px;background:#1C1917;color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer}
.btn-cancel{padding:8px 18px;border-radius:6px;background:#F0EDE8;color:#1C1917;border:none;font-weight:700;font-size:13px;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1917;color:#fff;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}

/* Per-deal push button */
.btn-push{padding:4px 10px;border-radius:4px;background:#FEEFE6;color:#D4460A;border:none;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.15s ease}
.btn-push:hover{background:#FCD9C5}
.btn-push:disabled{opacity:.5;cursor:not-allowed}
.btn-push.sent{background:#DCFCE7;color:#15803D}
.btn-pin{padding:4px 10px;border-radius:4px;background:#FEF3C7;color:#B45309;border:none;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.15s ease}
.btn-pin:hover{background:#FDE68A}
.btn-pin:disabled{opacity:.5;cursor:not-allowed}
.btn-pin.pinned{background:#F59E0B;color:#fff}
.btn-pin.pinned:hover{background:#D97706}
/* App Tabs config */
.apptab-move{padding:2px 8px;margin-right:4px;border-radius:4px;background:#F0EDE8;color:#57534E;border:none;font-size:11px;cursor:pointer}
.apptab-move:hover{background:#E7E2DB}
.apptab-move:disabled{opacity:.35;cursor:not-allowed}
.apptab-rename{margin-left:8px;padding:2px 7px;border-radius:4px;background:#F0EDE8;color:#78716C;border:none;font-size:12px;cursor:pointer}
.apptab-rename:hover{background:#E7E2DB}
.apptab-type{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.apptab-toggle{padding:5px 16px;border-radius:20px;background:#F5F5F4;color:#A8A29E;border:1px solid #E7E5E4;font-size:12px;font-weight:700;cursor:pointer;min-width:54px;transition:all 0.15s ease}
.apptab-toggle:hover{background:#ECEAE8}
.apptab-toggle.on{background:#16A34A;color:#fff;border-color:#16A34A}
.apptab-toggle.on:hover{background:#15803D}
.apptab-toggle:disabled{opacity:.6;cursor:not-allowed}
.raw-text-modal{max-height:200px;overflow-y:auto;padding:8px;border:1px solid #EEE;border-radius:6px;background:#F7F5F2;font-size:11px;white-space:pre-wrap;word-break:break-word;font-family:monospace}

/* Link Ops Tab */
.url-cell{display:block;padding:4px 7px;border-radius:4px;font-size:11px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;cursor:pointer}
.url-cell.raw{background:#F0EDE8;color:#78716C}
.url-cell.affiliate{background:#DCFCE7;color:#15803D}
.url-cell.zap{background:#E0F2FE;color:#0369A1}
.url-cell.empty{background:#F9F9F9;color:#C9B8B3;cursor:default}
/* Hot Deals ranking cards */
.hot-list{display:flex;flex-direction:column;gap:10px}
.hot-card{background:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:2px solid transparent;transition:border-color .15s}
.hot-card:hover{border-color:#FDE68A}
.hot-rank{font-size:26px;font-weight:900;color:#E8571A;min-width:44px;text-align:center;letter-spacing:-1px;flex-shrink:0}
.hot-move{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.hot-img-wrap{flex-shrink:0}
.hot-img-wrap img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:#F0EDE8;display:block}
.hot-img-placeholder{width:120px;height:120px;background:#F0EDE8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px}
.hot-info{flex:1;min-width:0}
.hot-plat{font-size:10px;font-weight:700;color:#A8A29E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hot-title{font-size:14px;font-weight:600;color:#1C1917;line-height:1.35;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.hot-price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.hot-price{font-size:20px;font-weight:800;color:#1C1917;letter-spacing:-.5px}
.hot-mrp{font-size:13px;color:#A8A29E;text-decoration:line-through}
.hot-disc{background:#16A34A;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px}
.hot-when{font-size:11px;color:#A8A29E;margin-top:4px}
.hot-drag-handle{cursor:grab;font-size:20px;color:#C9B8B3;padding:0 6px;flex-shrink:0;user-select:none;line-height:1}
.hot-drag-handle:hover{color:#78716C}
.hot-card[draggable]{cursor:default}
.hot-card.hot-drag-over{border-color:#E8571A!important;background:#FFF7ED}
.hot-card.hot-dragging{opacity:.35}
</style>
</head>
<body>

<div class="top">
  <h1>Zap<span>.</span> Pipeline Monitor</h1>
  <div style="font-size:12px;color:#A8A29E"><span class="dot"></span>Live</div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-label">Deals posted</div></div>
  <div class="stat"><div class="stat-val green" id="s-today">—</div><div class="stat-label">Posted today</div></div>
  <div class="stat"><div class="stat-val amber" id="s-logged">—</div><div class="stat-label">Pipeline logs</div></div>
  <div class="stat"><div class="stat-val red" id="s-filtered">—</div><div class="stat-label">Filtered out</div></div>
  <div class="stat"><div class="stat-val" id="s-clicks">—</div><div class="stat-label">Total clicks</div></div>
</div>

<div class="tabs" style="background:#F7F5F2;border:none">
  <button class="tab active-all" onclick="setTab('all',this)">All</button>
  <button class="tab" onclick="setTab('posted',this)">✅ Posted</button>
  <button class="tab" onclick="setTab('filtered',this)">❌ Filtered</button>
  <button class="tab" onclick="setTab('linkops',this)">🔗 Link Ops</button>
  <button class="tab" onclick="setTab('domains',this)">🌐 Domains <span id="pendingDot" style="display:none;background:#DC2626;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px"></span></button>
  <button class="tab" onclick="setTab('apptabs',this)">🗂 App Tabs</button>
  <button class="tab" onclick="setTab('hot',this)">🔥 Hot Deals</button>
</div>
<div class="toolbar">
  <input type="text" id="search" placeholder="Search deals, channels, reasons..." oninput="render()"/>
  <button class="btn-refresh" onclick="load()">↺ Refresh</button>
</div>

<div class="table-wrap">
  <div id="content" class="empty">Loading...</div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">Edit Deal</h3>
    <input type="hidden" id="modalDealId"/>
    <input type="hidden" id="modalLogIndex"/>
    <input type="hidden" id="modalMode"/>
    <input type="hidden" id="modalPlatform"/>
    <input type="hidden" id="modalUrl"/>

    <label>Title <span style="font-weight:400;color:#A8A29E">(product name shown on the card)</span></label>
    <input type="text" id="modalDisplayTitle" placeholder="e.g. Samsung Galaxy S25 Ultra 5G"/>

    <label>Description / Copy</label>
    <textarea id="modalCopy" rows="3"></textarea>

    <div style="display:flex;gap:10px">
      <div style="flex:1">
        <label>Deal Price (₹)</label>
        <input type="text" id="modalDealPrice" placeholder="e.g. 11,657"/>
      </div>
      <div style="flex:1">
        <label>MRP (₹) <span style="font-weight:400;color:#A8A29E">opt.</span></label>
        <input type="text" id="modalMrp" placeholder="e.g. 15,999"/>
      </div>
      <div style="flex:0 0 120px">
        <label>Discount (%)</label>
        <input type="text" id="modalDiscount" placeholder="1-99"/>
      </div>
    </div>

    <label>Image URL</label>
    <input type="text" id="modalImageUrl" placeholder="https://..." oninput="previewImg()"/>
    <img id="modalImgPreview" class="modal-img-preview"/>

    <label style="margin-top:16px">Raw Telegram Message</label>
    <div id="modalRawDisplay" class="raw-text-modal"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveModal()">Save & Post</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let activeTab = 'all';
let allLogs = [];
let allDeals = [];
let allLinkOps = [];
let allDomains = [];
let allTabs = [];
let allHotDeals = [];
let _hotDragId = null;
let linkOpsStatus = 'posted';  // Link Ops status filter — default to what users actually see

const STATUS_META = {
  posted:    { label: '✓ Posted',    color: '#16A34A', bg: '#DCFCE7' },
  filtered:  { label: 'Filtered',    color: '#78716C', bg: '#F5F5F4' },
  duplicate: { label: 'Duplicate',   color: '#9333EA', bg: '#F3E8FF' },
  held:      { label: 'Held',        color: '#CA8A04', bg: '#FEF9C3' },
  dead_link: { label: 'Dead link',   color: '#DC2626', bg: '#FEE2E2' },
  blocked:   { label: 'Blocked',     color: '#B91C1C', bg: '#FEE2E2' },
};

function setLinkOpsStatus(s) {
  linkOpsStatus = s;
  renderLinkOps(document.getElementById('search').value.toLowerCase().trim());
}

async function load(showSpinner = true) {
  if (showSpinner) document.getElementById('content').innerHTML = '<div class="empty">Loading...</div>';
  const [logsRes, dealsRes, linkOpsRes, domainsRes, tabsRes, hotRes] = await Promise.all([
    fetch('/admin/logs?limit=300').then(r=>r.json()).catch(()=>({logs:[]})),  // Live logs only
    fetch('/admin/deals?limit=300').then(r=>r.json()).catch(()=>({deals:[]})),
    fetch('/admin/link-ops?limit=300').then(r=>r.json()).catch(()=>({operations:[]})),
    fetch('/admin/redirect-domains').then(r=>r.json()).catch(()=>({domains:[]})),
    fetch('/admin/tabs').then(r=>r.json()).catch(()=>({tabs:[]})),
    fetch('/admin/hot-deals').then(r=>r.json()).catch(()=>({deals:[]})),
  ]);
  allLogs = logsRes.logs || [];
  allDeals = dealsRes.deals || [];
  allLinkOps = linkOpsRes.operations || [];
  allDomains = domainsRes.domains || [];
  allTabs = tabsRes.tabs || [];
  allHotDeals = hotRes.deals || [];

  // Pending-domain alert dot on the Domains tab
  const pendingCount = allDomains.filter(d => d.status === 'pending').length;
  const dot = document.getElementById('pendingDot');
  if (dot) {
    if (pendingCount > 0) { dot.style.display = 'inline-block'; dot.textContent = pendingCount; }
    else { dot.style.display = 'none'; }
  }

  const today = new Date().toISOString().split('T')[0];
  const todayDeals = allDeals.filter(d => d.created_at?.startsWith(today));
  const totalClicks = allDeals.reduce((s,d)=>s+(d.clicks||0),0);
  const filtered = allLogs.filter(l => !l.is_valid).length;

  document.getElementById('s-total').textContent = allDeals.length;
  document.getElementById('s-today').textContent = todayDeals.length;
  document.getElementById('s-logged').textContent = allLogs.length;
  document.getElementById('s-filtered').textContent = filtered;
  document.getElementById('s-clicks').textContent = totalClicks >= 1000 ? (totalClicks/1000).toFixed(1)+'K' : totalClicks;

  render();
}

function setTab(t, btn) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(b => b.className = 'tab');
  btn.className = `tab active-${t}`;
  render();
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-IN', {timeZone:'Asia/Kolkata', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:true}).replace(',','');
}

function getImageSource(raw, imageUrl) {
  if (!imageUrl) return 'none';
  if (imageUrl.includes('deal-images')) return raw ? 'telegram' : 'scraped';
  if (imageUrl.includes('amazon')) return 'amazon-cdn';
  if (imageUrl.includes('media-amazon')) return 'amazon-cdn';
  if (imageUrl.includes('myntra')) return 'myntra';
  if (imageUrl.includes('ajio')) return 'ajio';
  if (imageUrl.includes('flipkart')) return 'flipkart';
  return 'other';
}

function render() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();

  // Special case for Link Ops tab
  if (activeTab === 'linkops') {
    return renderLinkOps(q);
  }
  // Special case for Domains tab
  if (activeTab === 'domains') {
    return renderDomains(q);
  }
  // Special case for App Tabs config
  if (activeTab === 'apptabs') {
    return renderAppTabs();
  }
  // Special case for Hot Deals ranking
  if (activeTab === 'hot') {
    return renderHotDeals();
  }

  let items = [];

  if (activeTab === 'posted') {
    items = allDeals.map(d => ({type:'deal', ...d}));
  } else if (activeTab === 'filtered') {
    items = allLogs.filter(l => !l.is_valid && !l.admin_approved);
  } else {
    const logDealIds = new Set(allLogs.filter(l=>l.is_valid).map(l=>l.deal_id));
    items = [
      ...allLogs,
      ...allDeals.filter(d => !logDealIds.has(d.id)).map(d => ({
        type:'deal', is_valid:true, copy:d.copy, source_channel:d.source_channel,
        created_at:d.created_at, deal_id:d.id, image_url:d.image_url,
        raw_text:d.raw_text || '',
        llm_decision:{platform:d.platform, url:d.affiliate_url}
      }))
    ];
  }

  if (q) {
    items = items.filter(l =>
      (l.raw_text||'').toLowerCase().includes(q) ||
      (l.copy||l.llm_decision?.copy||'').toLowerCase().includes(q) ||
      (l.source_channel||'').toLowerCase().includes(q) ||
      (l.filter_reason||'').toLowerCase().includes(q)
    );
  }

  // Sort by message time (newest first) regardless of status
  items.sort((a, b) => {
    const aTime = new Date(a.timestamp_fetched || a.created_at || 0);
    const bTime = new Date(b.timestamp_fetched || b.created_at || 0);
    return bTime - aTime; // Descending (newest first)
  });

  if (!items.length) {
    document.getElementById('content').innerHTML = '<div class="empty">No results.</div>';
    return;
  }

  document.getElementById('content').innerHTML = `
    <table>
      <thead><tr>
        <th>Approval</th>
        <th>Msg Time</th>
        <th>Raw Message</th>

               </div>`;

          const badge = isApproved
            ? `<span class="badge admin-approved">✔ Admin<br/>Approved</span>`
            : isPosted
            ? `<span class="badge auto-posted">✅ Auto<br/>Posted</span>`
            : `<span class="badge filtered">❌ Filtered</span>`;

          const ctaBtn = url
            ? `<a href="${esc(url)}" target="_blank" class="cta-link">${esc(platform || 'Link')} →</a>`
            : `<span class="cta-empty">—</span>`;

          return `<tr>
            <td>${badge}</td>
            <td><span class="time-cell">${msgTime}</span></td>
            <td><div class="raw-text${!raw ? ' empty' : ''}" ${raw ? `title="${esc(raw)}" onclick="showRaw('${esc(raw).replace(/'/g,"\\'")}')"` : ''}>${raw ? esc(raw).substring(0,80) : '—'}</div></td>

            <td><div class="copy-text">${copy ? esc(copy.substring(0,80)) : '—'}</div></td>
            <td><div class="reason">${reason ? esc(reason.substring(0,80)) : '—'}</div></td>
            <td>${ctaBtn}</td>
            <td>${imgCell}</td>
            <td><span class="time-cell">${imgSrc}</span></td>
            <td><span class="time-cell">${postedTime}</span></td>

        }).join('')}
      </tbody>
    </table>`;
}

function renderLinkOps(q) {
  // Count rows per status (before status filter, after search) for the filter pills
  const searchMatch = op =>
    !q ||
    (op.raw_urls || []).some(u => u.includes(q)) ||
    (op.affiliate_url || '').includes(q) ||
    (op.zap_deal_url || '').includes(q) ||
    (op.channel || '').toLowerCase().includes(q) ||
    (op.platform || '').toLowerCase().includes(q);

  const searched = allLinkOps.filter(searchMatch);
  const counts = {};
  searched.forEach(op => { counts[op.status] = (counts[op.status] || 0) + 1; });
  const total = searched.length;

  // Status filter pills — 'all' plus each status that has rows
  const pill = (key, label, n) => {
    const active = linkOpsStatus === key;
    const meta = STATUS_META[key];
    const bg = active ? (meta ? meta.color : '#0369A1') : '#fff';
    const fg = active ? '#fff' : '#57534E';
    return '<button onclick="setLinkOpsStatus(\'' + key + '\')" style="'
      + 'border:1px solid #E7E5E4;border-radius:999px;padding:5px 12px;margin:0 6px 6px 0;'
      + 'font-size:12px;font-weight:600;cursor:pointer;background:' + bg + ';color:' + fg + '">'
      + label + ' <span style="opacity:.7">' + n + '</span></button>';
  };

  let pillsHtml = pill('all', 'All', total);
  ['posted','filtered','duplicate','held','dead_link','blocked'].forEach(k => {
    if (counts[k]) pillsHtml += pill(k, STATUS_META[k].label, counts[k]);
  });

  // Apply status filter
  let items = (linkOpsStatus === 'all') ? searched : searched.filter(op => op.status === linkOpsStatus);

  const filterBar = '<div style="padding:12px 4px 4px;display:flex;flex-wrap:wrap;align-items:center">'
    + pillsHtml
    + '<span style="margin-left:auto;font-size:11px;color:#A8A29E">'
    + 'Showing ' + items.length + ' of ' + total + ' — only “Posted” reaches users</span></div>';

  if (!items.length) {
    document.getElementById('content').innerHTML = filterBar
      + '<div class="empty">No rows for this status.</div>';
    return;
  }

  document.getElementById('content').innerHTML = filterBar + `
    <table>
      <thead><tr>
        <th>Time</th>
        <th>Status</th>
        <th>Channel</th>
        <th>Platform</th>
        <th>Copy</th>
        <th>Raw URL <span style="font-weight:400;color:#A8A29E">(from message)</span></th>
        <th>Affiliate URL <span style="font-weight:400;color:#A8A29E">(with tracking)</span></th>
        <th>Zap Deal URL <span style="font-weight:400;color:#A8A29E">(clean)</span></th>
      </tr></thead>
      <tbody>
        ${items.map(op => {
          const timestamp = fmtTime(op.timestamp);
          const channel = op.channel || '—';
          const platform = op.platform || 'unknown';
          const copy = op.copy || '—';

          const sm = STATUS_META[op.status] || { label: op.status, color: '#57534E', bg: '#F5F5F4' };
          const statusHtml = '<span title="' + esc(op.filter_reason || '') + '" style="'
            + 'display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;'
            + 'color:' + sm.color + ';background:' + sm.bg + '">' + sm.label + '</span>';

          const rawHtml = (op.raw_urls || []).length
            ? op.raw_urls.map(u => '<a href="' + esc(u) + '" target="_blank" class="url-cell raw" title="' + esc(u) + '">' + esc(u.substring(0, 45)) + '</a>').join('')
            : '<span class="url-cell empty">—</span>';

          const affiliateHtml = op.affiliate_url
            ? '<a href="' + esc(op.affiliate_url) + '" target="_blank" class="url-cell affiliate" title="' + esc(op.affiliate_url) + '">' + esc(op.affiliate_url.substring(0, 45)) + '</a>'
            : '<span class="url-cell empty">—</span>';

          const zapHtml = op.zap_deal_url
            ? '<a href="' + esc(op.zap_deal_url) + '" target="_blank" class="url-cell zap" title="' + esc(op.zap_deal_url) + '">' + esc(op.zap_deal_url.substring(0, 45)) + '</a>'
            : '<span class="url-cell empty">—</span>';

          return '<tr>'
            + '<td><span class="time-cell">' + timestamp + '</span></td>'
            + '<td>' + statusHtml + '</td>'
            + '<td><span class="channel">' + esc(channel) + '</span></td>'
            + '<td><span style="font-size:11px;font-weight:600">' + esc(platform) + '</span></td>'
            + '<td><div class="copy-text">' + esc(copy) + '</div></td>'
            + '<td>' + rawHtml + '</td>'
            + '<td>' + affiliateHtml + '</td>'
            + '<td>' + zapHtml + '</td>'
            + '</tr>';
        }).join('')}
      </tbody>
    </table>`;
}

function renderDomains(q) {
  let items = allDomains;
  if (q) items = items.filter(d => (d.domain || '').toLowerCase().includes(q) || (d.status || '').includes(q));

  // Sort: pending first (need attention), then approved, then blocked
  const order = { pending: 0, approved: 1, blocked: 2 };
  items = [...items].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || (b.seen_count || 0) - (a.seen_count || 0));

  const pending = items.filter(d => d.status === 'pending');
  const banner = pending.length
    ? '<div style="background:#FEF3C7;color:#B45309;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:600">⚠️ ' + pending.length + ' new redirect domain(s) awaiting your approval. Deals routed through them are held until you approve.</div>'
    : '';

  if (!items.length) {
    document.getElementById('content').innerHTML = '<div class="empty">No redirect domains yet. They appear here as channels use new trackers.</div>';
    return;
  }

  document.getElementById('content').innerHTML = banner + `
    <table>
      <thead><tr>
        <th>Domain</th>
        <th>Status</th>
        <th>Times Seen</th>
        <th>Sample URL</th>
        <th>First Seen</th>
        <th>Actions</th>
      </tr></thead>
      <tbody>
        ${items.map(d => {
          const status = d.status || 'pending';
          const sample = d.sample_url || '—';
          const firstSeen = d.first_seen ? fmtTime(d.first_seen) : '—';
          const badge = '<span class="dom-badge ' + status + '">' + status + '</span>';

          let actions = '';
          if (status === 'pending') {
            actions = '<button class="dom-btn approve" onclick="setDomain(\'' + esc(d.domain) + '\',\'approved\')">✓ Approve</button>'
                    + '<button class="dom-btn block" onclick="setDomain(\'' + esc(d.domain) + '\',\'blocked\')">✕ Block</button>';
          } else if (status === 'approved') {
            actions = '<button class="dom-btn block" onclick="setDomain(\'' + esc(d.domain) + '\',\'blocked\')">✕ Block</button>';
          } else {
            actions = '<button class="dom-btn approve" onclick="setDomain(\'' + esc(d.domain) + '\',\'approved\')">✓ Approve</button>';
          }

          return '<tr>'
            + '<td><span style="font-family:monospace;font-weight:600;font-size:12px">' + esc(d.domain) + '</span></td>'
            + '<td>' + badge + '</td>'
            + '<td>' + (d.seen_count || 1) + '</td>'
            + '<td><span style="font-family:monospace;font-size:11px;color:#78716C">' + esc(sample.substring(0, 50)) + '</span></td>'
            + '<td><span class="time-cell">' + firstSeen + '</span></td>'
            + '<td>' + actions + '</td>'
            + '</tr>';
        }).join('')}
      </tbody>
    </table>`;
}

async function setDomain(domain, status) {
  showToast('Updating ' + domain + '...');
  try {
    const res = await fetch('/admin/redirect-domains/' + encodeURIComponent(domain), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status}),
    });
    if (res.ok) {
      showToast('✅ ' + domain + ' → ' + status);
      // Update local copy and re-render
      const d = allDomains.find(x => x.domain === domain);
      if (d) d.status = status;
      const pendingCount = allDomains.filter(x => x.status === 'pending').length;
      const dot = document.getElementById('pendingDot');
      if (dot) { if (pendingCount > 0) { dot.style.display='inline-block'; dot.textContent=pendingCount; } else dot.style.display='none'; }
      render();
    } else {
      showToast('❌ Failed to update');
    }
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
}

async function generateAndApprove(logIndex, raw) {
  showToast('🤖 Generating copy and image...');
  console.log('[GENERATE] Starting with logIndex:', logIndex, 'raw:', raw.substring(0, 50));

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 45000); // 45 second timeout

    const response = await fetch('/admin/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({log_index: logIndex, raw_text: raw}),
      signal: controller.signal
    });

    clearTimeout(timeout);

    console.log('[GENERATE] Response status:', response.status);

    if (!response.ok) {
      showToast('❌ Server error: ' + response.status);
      openEdit('', logIndex, '', '', raw);
      return;
    }

    const result = await response.json();
    console.log('[GENERATE] Response:', result);

    if (result.status === 'generated') {
      console.log('[GENERATE] Success! Copy length:', result.copy.length, 'Image:', !!result.image_url);
      document.getElementById('modalDealId').value = '';
      document.getElementById('modalLogIndex').value = logIndex;
      document.getElementById('modalMode').value = 'approve';
      document.getElementById('modalTitle').textContent = '✨ Auto-Generated - Review & Save';
      document.getElementById('modalCopy').value = result.copy || '';
      document.getElementById('modalImageUrl').value = result.image_url || '';
      document.getElementById('modalPlatform').value = result.platform || '';
      document.getElementById('modalUrl').value = result.url || '';
      document.getElementById('modalRawDisplay').textContent = raw;
      // Price/title/discount aren't part of the generate flow — clear any stale
      // values left over from a previous edit so they don't bleed in.
      document.getElementById('modalDisplayTitle').value = '';
      document.getElementById('modalDealPrice').value = '';
      document.getElementById('modalMrp').value = '';
      document.getElementById('modalDiscount').value = '';
      previewImg();
      document.getElementById('editModal').classList.add('open');
      showToast('✅ Copy & image generated!');
    } else {
      console.log('[GENERATE] Failed with status:', result.status, 'message:', result.message);
      showToast('⚠️ ' + (result.message || 'Generation failed'));
      openEdit('', logIndex, '', '', raw);
    }
  } catch (e) {
    console.error('[GENERATE] Exception:', e);
    showToast('❌ Error: ' + e.message);
    openEdit('', logIndex, '', '', raw);
  }
}

function openEdit(dealId, logIndex, copy, imageUrl, raw) {
  // Pull the full deal so we can edit title/price/MRP/discount, not just copy.
  const deal = dealId ? allDeals.find(d => String(d.id) === String(dealId)) : null;
  document.getElementById('modalDealId').value = dealId;
  document.getElementById('modalLogIndex').value = logIndex;
  document.getElementById('modalPlatform').value = '';
  document.getElementById('modalUrl').value = '';
  document.getElementById('modalMode').value = dealId ? 'edit' : 'approve';
  document.getElementById('modalTitle').textContent = dealId ? 'Edit Deal' : 'Approve & Edit';
  document.getElementById('modalDisplayTitle').value = (deal && deal.display_title) || '';
  document.getElementById('modalCopy').value = copy || '';
  document.getElementById('modalDealPrice').value = (deal && deal.deal_price) || '';
  document.getElementById('modalMrp').value = (deal && deal.original_price) || '';
  document.getElementById('modalDiscount').value = (deal && deal.discount_pct != null) ? deal.discount_pct : '';
  document.getElementById('modalImageUrl').value = imageUrl || '';
  document.getElementById('modalRawDisplay').textContent = raw || '';
  previewImg();
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

function previewImg() {
  const url = document.getElementById('modalImageUrl').value;
  const img = document.getElementById('modalImgPreview');
  if (url) { img.src = url; img.style.display = 'block'; }
  else { img.style.display = 'none'; }
}

async function saveModal() {
  const dealId = document.getElementById('modalDealId').value;
  const rawLogIndex = parseInt(document.getElementById('modalLogIndex').value);
  const logIndex = isNaN(rawLogIndex) ? null : rawLogIndex;
  const mode = document.getElementById('modalMode').value;
  const copy = document.getElementById('modalCopy').value;
  const imageUrl = document.getElementById('modalImageUrl').value;
  const rawText = document.getElementById('modalRawDisplay').textContent || '';
  const platform = document.getElementById('modalPlatform').value || '';
  const url = document.getElementById('modalUrl').value || '';

  const pw = localStorage.getItem('zap_admin_pw');
  const headers = {'Content-Type':'application/json'};
  if (pw) headers['Authorization'] = 'Basic ' + btoa('admin:' + pw);

  try {
    let res;
    if (mode === 'edit' && dealId) {
      res = await fetch(`/admin/deals/${encodeURIComponent(dealId)}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({
          copy,
          image_url: imageUrl,
          display_title: document.getElementById('modalDisplayTitle').value,
          deal_price:    document.getElementById('modalDealPrice').value,
          original_price: document.getElementById('modalMrp').value,
          discount_pct:  document.getElementById('modalDiscount').value,
        })
      });
    } else {
      // Send the deal data directly (raw_text/platform/url) so approval doesn't
      // depend on the server's volatile in-memory log index.
      res = await fetch('/admin/approve', {
        method: 'POST',
        headers,
        body: JSON.stringify({log_index: logIndex, copy, image_url: imageUrl, raw_text: rawText, platform, url})
      });
    }

    if (res.status === 401) {
      const password = prompt('Enter admin password:');
      if (password) {
        localStorage.setItem('zap_admin_pw', password);
        saveModal(); // Retry with credentials
      }
      return;
    }

    if (res.ok) {
      showToast(mode === 'edit' ? 'Deal updated ✅' : 'Deal approved & posted ✅');
      closeModal();
      await load();
    } else {
      showToast('❌ Failed (status ' + res.status + ')');
    }
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
}

async function removeDeal(dealId) {
  if (!confirm('Remove this deal from the app?')) return;
  const pw = localStorage.getItem('zap_admin_pw');
  const creds = pw ? 'Basic ' + btoa('admin:' + pw) : null;

  try {
    const res = await fetch(`/admin/deals/${encodeURIComponent(dealId)}`, {
      method: 'DELETE',
      headers: creds ? {'Authorization': creds} : {}
    });
    if (res.status === 401) {
      const password = prompt('Enter admin password:');
      if (password) {
        localStorage.setItem('zap_admin_pw', password);
        removeDeal(dealId); // Retry with credentials
      }
      return;
    }
    if (res.ok) {
      showToast('Deal removed 🗑');
      await load();
    } else {
      showToast('❌ Failed to remove (status ' + res.status + ')');
    }
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
}

async function togglePin(btn, dealId, isPinned) {
  if (!dealId) { showToast('No deal id'); return; }
  const pw = localStorage.getItem('zap_admin_pw');
  const creds = pw ? 'Basic ' + btoa('admin:' + pw) : null;
  const next = !isPinned;
  btn.disabled = true;

  try {
    const res = await fetch(`/admin/deals/${encodeURIComponent(dealId)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', ...(creds ? {'Authorization': creds} : {}) },
      body: JSON.stringify({ pinned: next })
    });
    if (res.status === 401) {
      const password = prompt('Enter admin password:');
      if (password) {
        localStorage.setItem('zap_admin_pw', password);
        togglePin(btn, dealId, isPinned); // Retry with credentials
      }
      btn.disabled = false;
      return;
    }
    if (res.ok) {
      showToast(next ? 'Pinned to top 📌' : 'Unpinned');
      await load();
    } else {
      showToast('❌ Failed (status ' + res.status + ')');
      btn.disabled = false;
    }
  } catch (e) {
    showToast('❌ Error: ' + e.message);
    btn.disabled = false;
  }
}

  const tabs = [...allTabs].sort((a, b) => (a.position ?? 0) - (b.position ?? 0));

    return;
  }
  const rows = tabs.map((t, i) => {
    const meta = TAB_TYPE_META[t.type] || TAB_TYPE_META.category;
    const typeLabel = t.type === 'category' && t.value ? `${meta.label}: ${esc(t.value)}` : meta.label;

        </td>

            <button class="apptab-rename" onclick="renameTab('${esc(t.key)}')" title="Rename">✎</button></td>

    <table>
      <thead><tr><th>Order</th><th>Label</th><th>Shows</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

async function adminTabFetch(url, opts) {
  const pw = localStorage.getItem('zap_admin_pw');
  const creds = pw ? 'Basic ' + btoa('admin:' + pw) : null;
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(creds ? {'Authorization': creds} : {}), ...(opts?.headers || {}) },
  });
  if (res.status === 401) {
    const password = prompt('Enter admin password:');
    if (password) { localStorage.setItem('zap_admin_pw', password); return adminTabFetch(url, opts); }
  }
  return res;
}

async function toggleTab(key, isOn) {
  try {
    const res = await adminTabFetch(`/admin/tabs/${encodeURIComponent(key)}`, {
      method: 'PATCH', body: JSON.stringify({ enabled: !isOn }),
    });
    if (res.ok) { showToast(!isOn ? 'Tab enabled' : 'Tab disabled'); await load(false); }
    else showToast('❌ Failed (status ' + res.status + ')');
  } catch (e) { showToast('❌ Error: ' + e.message); }
}

async function renameTab(key) {
  const tab = allTabs.find(t => t.key === key);
  const label = prompt('Tab label (emojis allowed, e.g. "🔥 Hot"):', tab ? tab.label : '');
  if (label == null) return;
  if (!label.trim()) { showToast('Label cannot be empty'); return; }
  try {
    const res = await adminTabFetch(`/admin/tabs/${encodeURIComponent(key)}`, {
      method: 'PATCH', body: JSON.stringify({ label: label.trim() }),
    });
    if (res.ok) { showToast('Renamed'); await load(false); }
    else showToast('❌ Failed (status ' + res.status + ')');
  } catch (e) { showToast('❌ Error: ' + e.message); }
}

async function moveTab(key, dir) {
  const tabs = [...allTabs].sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
  const i = tabs.findIndex(t => t.key === key);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= tabs.length) return;
  [tabs[i], tabs[j]] = [tabs[j], tabs[i]];
  const order = tabs.map(t => t.key);
  try {
    const res = await adminTabFetch('/admin/tabs/reorder', {
      method: 'POST', body: JSON.stringify({ order }),
    });
    if (res.ok) { showToast('Reordered'); await load(false); }
    else showToast('❌ Failed (status ' + res.status + ')');
  } catch (e) { showToast('❌ Error: ' + e.message); }
}

// ── Hot Deals ranking ────────────────────────────────────────────────────────
function fmtPrice(v) {
  if (!v) return '';
  const n = parseInt(String(v).replace(/[^\d]/g, ''), 10);
  return isNaN(n) ? '' : '₹' + n.toLocaleString('en-IN');
}

function renderHotDeals() {
  const deals = [...allHotDeals].sort((a, b) => {
    const ap = a.pin_order != null ? a.pin_order : null;
    const bp = b.pin_order != null ? b.pin_order : null;
    if (ap == null && bp == null) return new Date(b.created_at) - new Date(a.created_at);
    if (ap == null) return -1;
    if (bp == null) return 1;
    return ap - bp;
  });

  if (!deals.length) {
    document.getElementById('content').innerHTML =
      '<div class="empty">No Hot deals yet.<br/><span style="font-size:13px;color:#A8A29E">Use the 📌 Pin button on the ✅ Posted tab to add deals here.</span></div>';
    return;
  }

  const cards = deals.map((d, i) => {
    const price  = fmtPrice(d.deal_price);
    const dpNum  = d.deal_price  ? parseInt(String(d.deal_price).replace(/\D/g,''), 10) : 0;
    const mrpNum = d.original_price ? parseInt(String(d.original_price).replace(/\D/g,''), 10) : 0;
    const mrp    = mrpNum > dpNum && dpNum > 0 ? fmtPrice(d.original_price) : '';
    const disc   = d.discount_pct ? `${d.discount_pct}% OFF` : '';
    const titleRaw = (d.display_title || d.copy || '').split('\n')[0];
    const title    = esc(titleRaw.slice(0, 120));
    const plat     = d.platform || '';
    const platform = esc(plat.charAt(0).toUpperCase() + plat.slice(1));
    const when     = fmtTime(d.created_at);
    const isFirst  = i === 0, isLast = i === deals.length - 1;

    const imgHtml = d.image_url
      ? `<img src="${esc(d.image_url)}" style="width:120px;height:120px;object-fit:cover;border-radius:10px;background:#F0EDE8;display:block" onerror="this.style.display='none'">`
      : `<div class="hot-img-placeholder">🛍</div>`;

    const priceParts = [
      price ? `<span class="hot-price">${price}</span>` : '',
      mrp   ? `<span class="hot-mrp">${mrp}</span>`    : '',
      disc  ? `<span class="hot-disc">${disc}</span>`   : '',
    ].filter(Boolean).join('');

    return `<div class="hot-card" draggable="true"
      ondragstart="hotDragStart(event,'${esc(String(d.id))}')"
      ondragover="hotDragOver(event)"
      ondrop="hotDrop(event,'${esc(String(d.id))}')"
      ondragend="hotDragEnd(event)">
      <div class="hot-rank">#${i + 1}</div>
      <div class="hot-drag-handle" title="Drag to reorder">⠿⠿</div>
      <div class="hot-img-wrap">${imgHtml}</div>
      <div class="hot-info">
        <div class="hot-plat">${platform}</div>
        <div class="hot-title">${title}</div>
        ${priceParts ? `<div class="hot-price-row">${priceParts}</div>` : ''}
        <div class="hot-when">Pinned · ${when}</div>
      </div>
      <div style="flex-shrink:0;align-self:center;margin-left:auto;padding-left:12px;display:flex;flex-direction:column;gap:6px">
        ${d.affiliate_url ? `<a href="${esc(d.affiliate_url)}" target="_blank" rel="noopener" class="cta-link" style="text-align:center">Check price →</a>` : ''}
        <button class="btn-remove" onclick="unpinFromHot('${esc(String(d.id))}')">📌 Unpin</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML =
    `<div style="padding:8px 4px 14px;color:#78716C;font-size:13px">
      <b>${deals.length} deal${deals.length > 1 ? 's' : ''}</b> in the 🔥 Hot tab — shown to users in this order. Use ▲▼ to rerank.
    </div>
    <div class="hot-list">${cards}</div>`;
}

function hotDragStart(e, id) {
  _hotDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  requestAnimationFrame(() => e.currentTarget.classList.add('hot-dragging'));
}

function hotDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const card = e.currentTarget;
  document.querySelectorAll('.hot-card.hot-drag-over').forEach(el => {
    if (el !== card) el.classList.remove('hot-drag-over');
  });
  if (!card.classList.contains('hot-dragging')) card.classList.add('hot-drag-over');
}

async function hotDrop(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.hot-card.hot-drag-over,.hot-card.hot-dragging').forEach(el => {
    el.classList.remove('hot-drag-over', 'hot-dragging');
  });
  if (!_hotDragId || _hotDragId === targetId) { _hotDragId = null; return; }

  // Sort the current list, remove the dragged item, insert before the target
  const sorted = [...allHotDeals].sort((a, b) => {
    const ap = a.pin_order != null ? a.pin_order : 9999;
    const bp = b.pin_order != null ? b.pin_order : 9999;
    return ap !== bp ? ap - bp : new Date(b.created_at) - new Date(a.created_at);
  });
  const moved    = sorted.find(d => String(d.id) === String(_hotDragId));
  const remaining = sorted.filter(d => String(d.id) !== String(_hotDragId));
  const toIdx    = remaining.findIndex(d => String(d.id) === String(targetId));
  if (toIdx < 0) remaining.push(moved); else remaining.splice(toIdx, 0, moved);

  _hotDragId = null;
  try {
    const res = await adminTabFetch('/admin/hot-deals/reorder', {
      method: 'POST', body: JSON.stringify({ order: remaining.map(d => d.id) }),
    });
    if (res && res.ok) { showToast('Reordered ✓'); await load(false); }
    else showToast('❌ Failed to reorder');
  } catch (err) { showToast('❌ ' + err.message); }
}

function hotDragEnd(e) {
  document.querySelectorAll('.hot-card').forEach(el =>
    el.classList.remove('hot-drag-over', 'hot-dragging'));
  _hotDragId = null;
}

async function unpinFromHot(dealId) {
  if (!confirm('Remove this deal from the 🔥 Hot tab?')) return;
  try {
    const res = await adminTabFetch(`/admin/deals/${encodeURIComponent(dealId)}`, {
      method: 'PATCH', body: JSON.stringify({ pinned: false }),
    });
    if (res && res.ok) { showToast('Removed from Hot tab'); await load(false); }
    else showToast('❌ Failed');
  } catch (e) { showToast('❌ ' + e.message); }
}

function showRaw(full) {
  document.getElementById('modalRawDisplay').textContent = full;
  document.getElementById('editModal').classList.add('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function pushDeal(btn, dealId, copy) {
  if (!dealId) { showToast('No deal id'); return; }
  const preview = (copy || '').substring(0, 100);
  if (!confirm(`Send this deal to all users?\n\n${preview}`)) return;

  const pw = localStorage.getItem('zap_admin_pw');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (pw) headers['Authorization'] = 'Basic ' + btoa('admin:' + pw);

    const res = await fetch('/notify', {
      method: 'POST',
      headers,
      body: JSON.stringify({ deal_id: dealId }),
    });

    if (res.status === 401) {
      const password = prompt('Enter admin password:');
      btn.disabled = false; btn.textContent = orig;
      if (password) {
        localStorage.setItem('zap_admin_pw', password);
        pushDeal(btn, dealId, copy);
      }
      return;
    }

    const d = await res.json();
    if (res.ok && d.status !== 'no_devices') {
      const sent = (d.expo || 0) + (d.fcm || 0);
      btn.textContent = `✓ Sent (${sent})`;
      btn.classList.add('sent');
      showToast(`📤 Sent to ${sent} device${sent !== 1 ? 's' : ''}`);
    } else if (d.status === 'no_devices') {
      btn.textContent = orig; btn.disabled = false;
      showToast('⚠️ No registered devices');
    } else {
      btn.textContent = orig; btn.disabled = false;
      showToast(`❌ Error ${res.status}`);
    }
  } catch(e) {
    btn.textContent = orig; btn.disabled = false;
    showToast(`❌ ${e.message}`);
  }
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();

// NO automatic polling. The previous version fired 6 heavy limit=300 queries
// every 60s, which — left open for hours — starved the shared-CPU API the app
// depends on (CPU-throttled it). Refresh is now MANUAL only: use the ↺ Refresh
// button in the toolbar. This keeps the dashboard from ever loading the API in
// the background.
</script>
